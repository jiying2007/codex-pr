name: Provider V2 Migrate Once

on:
  push:
    branches: [family/provider-contract-v2]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: family/provider-contract-v2
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Apply product migration
        env:
          CORE_SHA: 7878dae982088746c06e4fe747b2468e6af274a2
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const read=f=>JSON.parse(fs.readFileSync(f,'utf8')),write=(f,v)=>fs.writeFileSync(f,JSON.stringify(v,null,2)+'\n');
          const pkg=read('package.json');pkg.version='5.3.0';write('package.json',pkg);
          const contract=read('product-contract.json');contract.productVersion='5.3.0';contract.safeCoreVersion='4.12.0';contract.safeCoreCommit=process.env.CORE_SHA;contract.codexRuntimeVersionConsumed=2;contract.providerContractVersionConsumed=2;write('product-contract.json',contract);
          const noteEn=`\n## Provider Contract v2 family alignment\n\nCodex Change Safe 5.3.0 pins Core 4.12.0 and records Runtime/Provider Contract v2 consumption for Family compatibility. Change Safe still performs zero model calls by default and therefore does not expose model relay credentials or an auth.json setting of its own; Review, Commit, Diagnose and Review Service own those model-runtime controls. Change Safe's existing \`allowInsecureHttp\` remains scoped only to explicitly trusted GitHub/GitLab SCM APIs.\n`;
          const noteZh=`\n## Provider Contract v2 产品族对齐\n\nCodex Change Safe 5.3.0 固定到 Core 4.12.0，并在 Product Contract 中记录 Runtime/Provider Contract v2 消费关系。Change Safe 默认模型调用仍为 0，因此不会额外暴露模型中转站凭据或 auth.json 设置；模型 Runtime 配置由 Review、Commit、Diagnose 与 Review Service 使用。Change Safe 现有 \`allowInsecureHttp\` 仍只服务于显式信任的 GitHub/GitLab SCM API。\n`;
          for(const [f,n] of [['README.md',noteEn],['README.zh-CN.md',noteZh]]){let t=fs.readFileSync(f,'utf8');if(!t.includes('Provider Contract v2 family alignment')&&!t.includes('Provider Contract v2 产品族对齐'))t+=n;fs.writeFileSync(f,t);}
          let c=fs.readFileSync('CHANGELOG.md','utf8');if(!c.includes('## 5.3.0 - 2026-09-01'))c=c.replace(/^# Changelog\n/,`# Changelog\n\n## 5.3.0 - 2026-09-01\n\n### Core 4.12 / Provider Contract v2 alignment\n\n- Pin Codex Safe Core 4.12.0 and record Runtime/Provider Contract v2 consumption.\n- Keep Change Safe deterministic with zero default model calls; no redundant model-provider credential surface is added.\n- Preserve Change Safe SCM-side trusted-HTTP policy as a separate provider-domain control.\n`);fs.writeFileSync('CHANGELOG.md',c);
          NODE
          git -C src/codex-safe-core fetch origin "$CORE_SHA"
          git -C src/codex-safe-core checkout --detach "$CORE_SHA"
          if [ -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts --no-audit --no-fund; fi
          rm .github/workflows/provider-v2-migrate-once.yml
          git config user.name codex-safe-family-bot
          git config user.email codex-safe-family-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "chore(change): align Provider Contract v2"
          git push origin HEAD:family/provider-contract-v2
