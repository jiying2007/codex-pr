name: Generate v1.0.1 lockfile

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'maintenance-1.0.1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maintenance-1.0.1
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm run verify:lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':!package-lock.json'
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already exact.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: sync 1.0.1 package lock'
          git push origin HEAD:maintenance-1.0.1
