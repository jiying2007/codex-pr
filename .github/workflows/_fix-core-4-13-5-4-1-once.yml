name: Fix Change Safe 5.4.1 Core v3 Governance Once
on:
  push:
    branches: [chore/core-4.13.0-5.4.1]
permissions:
  contents: write
jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '24.19.0' }
      - name: Align v3 governance and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-manifest.js'); s=p.read_text()
          s=s.replace("if(contract.codexRuntimeVersionConsumed!==2||contract.providerContractVersionConsumed!==2)fail('Provider Contract v2 consumption must remain explicit');","if(contract.codexRuntimeVersionConsumed!==3||contract.providerContractVersionConsumed!==3)fail('Runtime/Provider Contract v3 consumption must remain explicit');")
          s=s.replace("canonical policy example must pin schema provenance to Core 4.12 exact SHA","canonical policy example must pin schema provenance to Core 4.13 exact SHA")
          s=s.replace("'README.md':[`- Safe Core: \\`4.12.5\\` exact pin \\`${core}\\``,'Codex Change Safe 5.4.0 pins Core 4.12.5'],","'README.md':[`- Safe Core: \\`4.13.0\\` exact pin \\`${core}\\``,'Codex Change Safe 5.4.1 pins Core 4.13.0'],")
          s=s.replace("'README.zh-CN.md':[`- Safe Core：\\`4.12.5\\` 精确 pin \\`${core}\\``,'Codex Change Safe 5.4.0 固定到 Core 4.12.5']","'README.zh-CN.md':[`- Safe Core：\\`4.13.0\\` 精确 pin \\`${core}\\``,'Codex Change Safe 5.4.1 固定到 Core 4.13.0']")
          p.write_text(s)
          p=Path('README.md'); s=p.read_text()
          s=s.replace('- Safe Core: `4.12.5` exact pin','- Safe Core: `4.13.0` exact pin')
          s=s.replace('## Provider Contract v2 family alignment','## Runtime/Provider Contract v3 family alignment')
          s=s.replace('Codex Change Safe 5.4.0 pins Core 4.12.5 and records Runtime/Provider Contract v2 consumption for Family compatibility.','Codex Change Safe 5.4.1 pins Core 4.13.0 and records Runtime/Provider Contract v3 consumption for Family compatibility.')
          p.write_text(s)
          p=Path('README.zh-CN.md'); s=p.read_text()
          s=s.replace('- Safe Core：`4.12.5` 精确 pin','- Safe Core：`4.13.0` 精确 pin')
          s=s.replace('## Provider Contract v2 产品族对齐','## Runtime/Provider Contract v3 产品族对齐')
          s=s.replace('Codex Change Safe 5.4.0 固定到 Core 4.12.5，并在 Product Contract 中记录 Runtime/Provider Contract v2 消费关系。','Codex Change Safe 5.4.1 固定到 Core 4.13.0，并在 Product Contract 中记录 Runtime/Provider Contract v3 消费关系。')
          p.write_text(s)
          p=Path('CHANGELOG.md'); s=p.read_text().replace('\r\n','\n')
          prefix='## 5.4.1 - 2026-09-03\n\n- Repin Codex Change Safe to immutable Codex Safe Core 4.13.0 and consume Runtime/Provider Contract v3 provenance without changing SCM delivery behavior.\n- Preserve GitHub/GitLab provider discovery, GitLab 14.6.1+ compatibility, private-LAN HTTP trust rules, zero default model calls, Review Receipt v5 and Commit Receipt v4 consumption unchanged.\n\n# Changelog\n\n'
          if s.startswith(prefix): s='# Changelog\n\n'+prefix.split('# Changelog\n\n',1)[0]+s[len(prefix):]
          p.write_text(s)
          PY
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          npm run build
          npm run package
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-manifest.js README.md README.zh-CN.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore(core): align Change Safe 5.4.1 Runtime v3 governance'
            git push origin HEAD:chore/core-4.13.0-5.4.1
          fi
