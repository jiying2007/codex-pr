name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.22.2', '24.19.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci

  extension-host:
    if: github.event_name != 'push'
    uses: ./.github/workflows/integration.yml

  gitlab-provider:
    if: github.event_name != 'push'
    uses: ./.github/workflows/gitlab-provider.yml

  codeql:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then echo 'enabled=true' >> "$GITHUB_OUTPUT"; else echo 'enabled=false' >> "$GITHUB_OUTPUT"; fi
      - if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
      - if: steps.graph.outputs.enabled != 'true'
        run: npm audit --audit-level=high --omit=dev

  family-release-guard:
    if: github.event_name == 'pull_request'
    uses: jiying2007/codex-safe-core/.github/workflows/family-release-guard.yml@00403dd14877e978698c63d06f6dbdfe2ba9b8cc
    with:
      product: codex-change-safe
      expected_core_sha: 00403dd14877e978698c63d06f6dbdfe2ba9b8cc

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [test, extension-host, gitlab-provider, codeql, dependency-review, family-release-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every applicable CI dependency to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node - <<'NODE'
          const needs=JSON.parse(process.env.NEEDS_JSON);
          const skippableOnPush=new Set(['extension-host','gitlab-provider','dependency-review','family-release-guard']);
          const failed=Object.entries(needs).filter(([name,value]) => {
            if (value.result === 'success') return false;
            return !(process.env.EVENT_NAME === 'push' && skippableOnPush.has(name) && value.result === 'skipped');
          });
          if(failed.length){
            console.error('CI Gate blocked:',failed.map(([k,v])=>k+'='+v.result).join(', '));
            process.exit(1);
          }
          NODE
