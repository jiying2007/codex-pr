name: Bootstrap source

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'source-v1.0.0' && hashFiles('.bootstrap/codex-pr-source.zip') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: source-v1.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Expand source
        shell: bash
        run: |
          set -euo pipefail
          unzip -o .bootstrap/codex-pr-source.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          rm -f .github/workflows/bootstrap-pr.yml
          rm -f .bootstrap-pr-trigger
      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm run verify:lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run package
      - name: Commit complete initial source
        shell: bash
        run: |
          set -euo pipefail
          rm -f codex-pr-safe-*.vsix
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: release Codex PR Safe 1.0.0'
          git push origin HEAD:source-v1.0.0
