name: Finalize 1.0.2 consistency branch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'consistency-1.0.2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: consistency-1.0.2
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Apply runtime localization migration
        run: node scripts/apply-runtime-l10n.js
      - name: Generate exact 1.0.2 lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm run verify:lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Commit final branch state
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-runtime-l10n.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension.js test.js package-lock.json scripts/apply-runtime-l10n.js
          git diff --cached --quiet && { echo 'expected consistency changes were not produced' >&2; exit 1; }
          git commit -m 'chore: finalize 1.0.2 localization and lockfile'
          git push origin HEAD:consistency-1.0.2
      - name: Remove accidental probe branch
        shell: bash
        run: git push origin --delete test-do-not-use || true
