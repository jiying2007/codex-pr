name: Clean 1.0.2 consistency migration

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'consistency-1.0.2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Remove obsolete migration branch
        shell: bash
        run: git push origin --delete product-family-1.0.2 || true
      - name: Self-remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/consistency-1.0.2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/consistency-1.0.2.yml
          git commit -m 'chore: remove 1.0.2 consistency migration workflow'
          git push origin HEAD:main
