name: Temporary Change Core 4.13.1 alignment

on:
  push:
    branches: [chore/core-4.13.1-alignment]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Repin Core and prepare Change 5.4.2
        shell: bash
        run: |
          set -euo pipefail
          core_sha=479e4b33356457a90617aea7bbba5ee25b65b2c8
          curl -fsSL "https://raw.githubusercontent.com/jiying2007/codex-safe-core/${core_sha}/scripts/repin-consumer.js" -o /tmp/repin-consumer.js
          node /tmp/repin-consumer.js "$PWD" "$core_sha"
          node <<'NODE'
          const fs=require('node:fs');
          const version='5.4.2';
          const writeJson=(file,mutate)=>{if(!fs.existsSync(file))return;const value=JSON.parse(fs.readFileSync(file,'utf8'));mutate(value);fs.writeFileSync(file,JSON.stringify(value,null,2)+'\n');};
          writeJson('package.json',value=>{value.version=version;});
          writeJson('package-lock.json',value=>{value.version=version;if(value.packages?.[''])value.packages[''].version=version;});
          writeJson('product-contract.json',value=>{value.productVersion=version;});
          if(fs.existsSync('CHANGELOG.md')){let text=fs.readFileSync('CHANGELOG.md','utf8');const header='# Changelog\n\n';const entry=`## 5.4.2 - 2026-09-03\n\n- Repin Codex Change Safe to immutable Codex Safe Core 4.13.1 to restore exact Family trust-root alignment after the structured Codex transcript safety patch.\n- Change remains deterministic with zero default model calls; GitHub/GitLab delivery behavior, authorization gates and receipt contracts are unchanged.\n\n`;if(!text.includes('## 5.4.2'))text=text.startsWith(header)?header+entry+text.slice(header.length):entry+text;fs.writeFileSync('CHANGELOG.md',text);}
          NODE
          git rm .github/workflows/tmp-core-4.13.1-alignment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(runtime): align Change to Core 4.13.1'
          git push origin HEAD:chore/core-4.13.1-alignment
