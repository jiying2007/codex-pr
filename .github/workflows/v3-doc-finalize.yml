name: PR Safe v3 docs finalizer

on:
  push:
    branches: [feat/family-v3-pr]
    paths: [.github/workflows/v3-doc-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }
      - name: Align PR Safe v3 docs
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive
          node <<'NODE'
          const fs=require('fs');const core='e6e25b502aa35a079f660346785cf283fe293b6d';
          const docs=['README.md','README.zh-CN.md','SECURITY.md','PUBLISHING.md','CONTRIBUTING.md'];
          for(const file of docs){if(!fs.existsSync(file))continue;let s=fs.readFileSync(file,'utf8');s=s.replace(/Review Receipt v2/g,'Review Receipt v3').replace(/Commit Receipt v2/g,'Commit Receipt v3').replace(/Policy Schema v2/g,'Policy Schema v3').replace(/Safe Core v2/g,'Safe Core v3').replace(/Core v2/g,'Core v3').replace(/"schemaVersion"\s*:\s*2/g,'"schemaVersion": 3').replace(/schemaVersion:\s*2/g,'schemaVersion: 3').replace(/codex-safe-core\/[0-9a-f]{40,64}\/codex-safe\.schema\.json/g,`codex-safe-core/${core}/codex-safe.schema.json`);if(file==='README.md'&&!s.includes('Safe Contract remains v2'))s=s.replace('\n## ',`\n\nFamily v3 pins Codex Safe Core 3.0.1 at \`${core}\`; Safe Contract remains v2 while Policy and Receipt protocols are v3.\n\n## `);if(file==='README.zh-CN.md'&&!s.includes('Safe Contract 仍保持 v2'))s=s.replace('\n## ',`\n\nFamily v3 固定使用 Codex Safe Core 3.0.1（\`${core}\`）；Safe Contract 仍保持 v2，Policy 与 Receipt 协议为 v3。\n\n## `);fs.writeFileSync(file,s);}
          NODE
          npm run verify:lock
          git rm .github/workflows/v3-doc-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README* SECURITY.md PUBLISHING.md CONTRIBUTING.md
          git diff --cached --check
          git commit -m 'docs: align PR Safe with Family v3 protocols'
          git push origin HEAD:feat/family-v3-pr
