name: Temporary Change identity docs
on:
  push:
    branches: [fix/docs-identity-5.4.3]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: true, fetch-depth: 0}
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: {node-version: '22.22.2'}
      - name: Align current Change identity docs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const version='5.4.3';
          const writeJson=(file,fn)=>{const x=JSON.parse(fs.readFileSync(file,'utf8'));fn(x);fs.writeFileSync(file,JSON.stringify(x,null,2)+'\n');};
          writeJson('package.json',x=>x.version=version);
          writeJson('package-lock.json',x=>{x.version=version;if(x.packages?.[''])x.packages[''].version=version;});
          writeJson('product-contract.json',x=>x.productVersion=version);
          const docs=['README.md','README.zh-CN.md','docs/ARCHITECTURE.md','docs/WORKFLOW.md','docs/WORKFLOW.zh-CN.md','docs/GITLAB_SELF_MANAGED.md','docs/GITLAB_SELF_MANAGED.zh-CN.md','SUPPORT.md','SECURITY.md','PUBLISHING.md','VERIFY_RELEASE.md'].filter(fs.existsSync);
          for(const file of docs){let s=fs.readFileSync(file,'utf8');s=s.replace(/Codex Change Safe 5\.4\.1/g,'Codex Change Safe 5.4.3').replace(/Codex Change Safe 5\.4\.2/g,'Codex Change Safe 5.4.3').replace(/Safe Core 4\.13\.0/g,'Safe Core 4.13.1').replace(/Core 4\.13\.0/g,'Core 4.13.1').replace(/Safe Core: `4\.13\.0`/g,'Safe Core: `4.13.1`');fs.writeFileSync(file,s);}
          let c=fs.readFileSync('CHANGELOG.md','utf8');if(!c.includes('## 5.4.3'))c=c.replace('# Changelog\n','# Changelog\n\n## 5.4.3 - 2026-09-03\n\n- Align current product/Core identity documentation with Change 5.4.3 and immutable Core 4.13.1 after the SCM response-bound patch.\n- Preserve Change 5.4.2 deterministic delivery behavior, 8 MiB streamed SCM response ceiling and zero default model calls; this patch changes documentation/product identity only.\n');fs.writeFileSync('CHANGELOG.md',c);
          NODE
          grep -nRE 'Codex Change Safe 5\.4\.1|Codex Change Safe 5\.4\.2|Safe Core:? `?4\.13\.0|Core 4\.13\.0' README.md README.zh-CN.md docs/ARCHITECTURE.md docs/WORKFLOW.md docs/WORKFLOW.zh-CN.md docs/GITLAB_SELF_MANAGED.md docs/GITLAB_SELF_MANAGED.zh-CN.md SUPPORT.md SECURITY.md PUBLISHING.md VERIFY_RELEASE.md 2>/dev/null && exit 2 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json product-contract.json CHANGELOG.md README.md README.zh-CN.md docs SUPPORT.md SECURITY.md PUBLISHING.md VERIFY_RELEASE.md
          git diff --cached --check
          git commit -m 'docs(identity): align Change 5.4.3 current state'
          git push origin HEAD:fix/docs-identity-5.4.3
