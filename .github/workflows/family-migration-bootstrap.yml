name: Family migration bootstrap
on:
  push:
    branches: [family/judgment-lifecycle-v1]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: family/judgment-lifecycle-v1
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Apply deterministic Change 5.2.0 migration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const version='5.2.0',coreVersion='4.11.0',coreSha='8375907712db37492aff1ac0d0013e2753b1f6ab';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version=version;fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));lock.version=version;if(lock.packages?.[''])lock.packages[''].version=version;fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          const pc=JSON.parse(fs.readFileSync('product-contract.json','utf8'));Object.assign(pc,{productVersion:version,safeCoreVersion:coreVersion,safeCoreCommit:coreSha,reviewReceiptSchemaConsumed:5,judgmentLifecycleVersionConsumed:1});fs.writeFileSync('product-contract.json',JSON.stringify(pc,null,2)+'\n');
          if(fs.existsSync('.codex-safe.example.json')){const value=JSON.parse(fs.readFileSync('.codex-safe.example.json','utf8'));if(value.$schema)value.$schema=`https://raw.githubusercontent.com/jiying2007/codex-safe-core/${coreSha}/codex-safe.schema.json`;fs.writeFileSync('.codex-safe.example.json',JSON.stringify(value,null,2)+'\n');}
          let manifest=fs.readFileSync('scripts/verify-manifest.js','utf8');manifest=manifest.replace(/const core='[0-9a-f]{40}';if\(contract\.safeCoreVersion!=='[^']+'\|\|contract\.safeCoreCommit!==core\)/,"const core='"+coreSha+"';if(contract.safeCoreVersion!=='"+coreVersion+"'||contract.safeCoreCommit!==core)");fs.writeFileSync('scripts/verify-manifest.js',manifest);
          let release=fs.readFileSync('.github/workflows/release.yml','utf8');
          if(!release.includes('gh release verify-asset "$TAG"')){
            const needle='          gh release create "$TAG" codex-change-safe-*.vsix SBOM.spdx.json SHA256SUMS --title "Codex Change Safe ${{ needs.validate.outputs.version }}" --generate-notes --verify-tag\n';
            if(!release.includes(needle))throw new Error('release create anchor changed');
            const verify=`${needle}          immutable=false\n          for attempt in {1..12}; do\n            immutable=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.immutable')\n            [[ "$immutable" == true ]] && break\n            sleep 5\n          done\n          test "$immutable" = true\n          gh release verify "$TAG"\n          for asset in codex-change-safe-*.vsix SBOM.spdx.json SHA256SUMS; do gh release verify-asset "$TAG" "$asset"; done\n`;
            release=release.replace(needle,verify);
          }
          fs.writeFileSync('.github/workflows/release.yml',release);
          let changelog=fs.readFileSync('CHANGELOG.md','utf8');
          if(!changelog.startsWith('## 5.2.0\n'))changelog=`## 5.2.0\n\n- Adopt immutable Safe Core 4.11.0 and Review Receipt v5 qualification semantics.\n- Make require-review/require-all depend on Review coverage, mechanical and quality gates rather than the Review-only needs_evidence readiness state.\n- Keep blocked/incomplete/mechanical-fail Review evidence fail closed while Change retains merge-readiness authority.\n- Verify immutable GitHub Release provenance and every VSIX/SBOM/checksum asset inside the release workflow.\n\n${changelog}`;
          fs.writeFileSync('CHANGELOG.md',changelog);
          NODE
          rm .github/workflows/family-migration-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(change): finalize 5.2.0 family migration'
          git push origin HEAD:family/judgment-lifecycle-v1
