name: Apply product-family 1.0.2 migration

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'product-family-1.0.2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: product-family-1.0.2
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Wire runtime l10n and generate bundles
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const extensionPath = 'extension.js';
          let extension = fs.readFileSync(extensionPath, 'utf8');
          const old = "function isChineseUi() { return /^zh(?:-|$)/i.test(String(vscode.env?.language || '')); }\nfunction ui(zh, en) { return isChineseUi() ? zh : en; }";
          const replacement = `function isChineseUi() { return /^zh(?:-|$)/i.test(String(vscode.env?.language || '')); }\nfunction formatUiFallback(template, args) {\n  return String(template).replace(/\\{(\\d+)\\}/g, (_match, index) => args[Number(index)] === undefined ? \`{\${index}}\` : String(args[Number(index)]));\n}\nfunction ui(zh, en, ...args) {\n  const source = String(en);\n  if (vscode.l10n?.t) {\n    const translated = vscode.l10n.t(source, ...args);\n    if (translated !== source || !isChineseUi()) return translated;\n  }\n  return formatUiFallback(isChineseUi() ? zh : source, args);\n}`;
          if (!extension.includes(old) && !extension.includes('function formatUiFallback(')) throw new Error('runtime l10n insertion point not found');
          if (extension.includes(old)) extension = extension.replace(old, replacement);
          fs.writeFileSync(extensionPath, extension);

          function extractPairs(text) {
            const pairs = [];
            const re = /ui\(\s*('(?:\\.|[^'\\])*')\s*,\s*('(?:\\.|[^'\\])*')\s*\)/g;
            for (const match of text.matchAll(re)) {
              const zh = Function(`\"use strict\"; return (${match[1]});`)();
              const en = Function(`\"use strict\"; return (${match[2]});`)();
              pairs.push([en, zh]);
            }
            return pairs;
          }

          const files = ['extension.js', 'src/preview.js'];
          const pairs = files.flatMap(file => extractPairs(fs.readFileSync(file, 'utf8')));
          const en = {};
          const zh = {};
          for (const [key, value] of pairs) {
            if (zh[key] !== undefined && zh[key] !== value) throw new Error(`conflicting Chinese translation for: ${key}`);
            en[key] = key;
            zh[key] = value;
          }
          fs.mkdirSync('l10n', { recursive: true });
          fs.writeFileSync('l10n/bundle.l10n.json', JSON.stringify(en, null, 2) + '\n');
          fs.writeFileSync('l10n/bundle.l10n.zh-cn.json', JSON.stringify(zh, null, 2) + '\n');
          console.log(`generated ${Object.keys(en).length} runtime localization keys`);
          NODE
      - name: Strengthen localization verification
        shell: bash
        run: |
          cat > scripts/verify-l10n.js <<'NODE'
          'use strict';
          const fs = require('fs');
          const assert = require('assert');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const manifestEn = JSON.parse(fs.readFileSync('package.nls.json', 'utf8'));
          const manifestZh = JSON.parse(fs.readFileSync('package.nls.zh-cn.json', 'utf8'));
          const runtimeEn = JSON.parse(fs.readFileSync('l10n/bundle.l10n.json', 'utf8'));
          const runtimeZh = JSON.parse(fs.readFileSync('l10n/bundle.l10n.zh-cn.json', 'utf8'));

          assert.strictEqual(pkg.l10n, './l10n', 'package.json must declare the runtime l10n bundle directory');
          assert.deepStrictEqual(Object.keys(manifestEn).sort(), Object.keys(manifestZh).sort(), 'manifest NLS catalogs must contain identical keys');
          assert.deepStrictEqual(Object.keys(runtimeEn).sort(), Object.keys(runtimeZh).sort(), 'runtime l10n catalogs must contain identical keys');

          const manifestText = JSON.stringify(pkg);
          const placeholders = new Set([...manifestText.matchAll(/%([^%]+)%/g)].map(m => m[1]));
          for (const key of placeholders) {
            assert.ok(Object.prototype.hasOwnProperty.call(manifestEn, key), `Missing English NLS key: ${key}`);
            assert.ok(Object.prototype.hasOwnProperty.call(manifestZh, key), `Missing Chinese NLS key: ${key}`);
          }

          for (const [setting, spec] of Object.entries(pkg.contributes?.configuration?.properties || {})) {
            assert.strictEqual(spec.scope, 'application', `${setting} must be application-scoped; repository policy belongs in committed .codex-pr.json`);
          }

          function extractPairs(text) {
            const pairs = [];
            const re = /ui\(\s*('(?:\\.|[^'\\])*')\s*,\s*('(?:\\.|[^'\\])*')\s*\)/g;
            for (const match of text.matchAll(re)) {
              const zh = Function(`\"use strict\"; return (${match[1]});`)();
              const en = Function(`\"use strict\"; return (${match[2]});`)();
              pairs.push([en, zh]);
            }
            return pairs;
          }
          for (const file of ['extension.js', 'src/preview.js']) {
            for (const [key, expectedZh] of extractPairs(fs.readFileSync(file, 'utf8'))) {
              assert.strictEqual(runtimeEn[key], key, `Missing English runtime l10n key from ${file}: ${key}`);
              assert.strictEqual(runtimeZh[key], expectedZh, `Chinese runtime l10n drift for ${file}: ${key}`);
            }
          }
          assert.ok(Object.keys(runtimeEn).length >= 10, 'runtime l10n catalog is unexpectedly small');
          console.log(`Localization catalogs OK: manifest=${Object.keys(manifestEn).length}, runtime=${Object.keys(runtimeEn).length}.`);
          NODE
      - name: Align Extension Host consistency smoke
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'test/integration/suite/index.js';
          let text = fs.readFileSync(file, 'utf8');
          text = text.replace("await cfg.update('baseBranch', 'main', vscode.ConfigurationTarget.Workspace);", "await cfg.update('baseBranch', 'main', vscode.ConfigurationTarget.Global);");
          if (!text.includes('function smokeProductFamilyConsistency(')) {
            const marker = 'async function run() {';
            const helper = `function smokeProductFamilyConsistency(extension) {\n  const pkg = require(path.join(extension.extensionPath, 'package.json'));\n  for (const [name, spec] of Object.entries(pkg.contributes.configuration.properties)) {\n    assert.strictEqual(spec.scope, 'application', \`\${name} must be application-scoped\`);\n  }\n  assert.strictEqual(pkg.l10n, './l10n');\n  const zhPath = path.join(extension.extensionPath, 'l10n', 'bundle.l10n.zh-cn.json');\n  assert.ok(fs.existsSync(zhPath), 'Simplified-Chinese runtime bundle is missing');\n  const zh = JSON.parse(fs.readFileSync(zhPath, 'utf8'));\n  assert.strictEqual(zh['Select the repository for the PR'], '选择要生成 PR 的仓库');\n  assert.strictEqual(zh['Codex PR Safe: copied'], 'Codex PR Safe：已复制');\n  assert.strictEqual(zh['The current PR result is stale. Generate it again.'], '当前 PR 结果已失效，请重新生成。');\n}\n\n`;
            if (!text.includes(marker)) throw new Error('integration insertion point not found');
            text = text.replace(marker, helper + marker);
          }
          const activation = "  await extension.activate();\n";
          if (!text.includes('smokeProductFamilyConsistency(extension);')) {
            text = text.replace(activation, activation + "  if (process.env.CODEX_PR_IT_ZH_SMOKE) smokeProductFamilyConsistency(extension);\n");
          }
          fs.writeFileSync(file, text);
          NODE
      - name: Generate exact lockfile and validate
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm run verify:lock
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Commit mechanical migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extension.js l10n scripts/verify-l10n.js test/integration/suite/index.js package-lock.json
          if git diff --cached --quiet; then
            echo 'No mechanical changes to commit.'
            exit 0
          fi
          git commit -m 'chore: align runtime localization and lockfile'
          git push origin HEAD:product-family-1.0.2
