name: Verify and clean v1.0.0

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  verify-clean:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'finalize-v1.0.0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Verify tag and published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          git merge-base --is-ancestor 'v1.0.0^{commit}' HEAD
          gh release view v1.0.0 --json assets --jq '.assets[].name' > /tmp/assets.txt
          grep -Fx 'codex-pr-safe-1.0.0.vsix' /tmp/assets.txt
          grep -Fx 'SHA256SUMS' /tmp/assets.txt
          mkdir -p /tmp/release
          gh release download v1.0.0 \
            -p 'codex-pr-safe-1.0.0.vsix' \
            -p 'SHA256SUMS' \
            -D /tmp/release
          (cd /tmp/release && sha256sum -c SHA256SUMS)
      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-v1.0.0-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/finalize-v1.0.0-pr.yml
          git commit -m 'chore: remove v1.0.0 finalizer'
          git push origin HEAD:main
      - name: Remove temporary branch
        shell: bash
        run: git push origin --delete finalize-v1.0.0
