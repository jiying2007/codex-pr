name: Apply Change Family UI Once
on:
  push:
    branches: [feat/family-scm-ui-contract]
    paths: [.github/workflows/_apply-family-ui-once.yml]
permissions: { contents: write }
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: feat/family-scm-ui-contract, submodules: recursive }
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '22.22.2' }
      - shell: bash
        run: |
          set -euo pipefail
          core=cd9788f1280a217fbe6d0beb59682a85a8b82c4d
          npm version 5.1.3 --no-git-tag-version --ignore-scripts
          git -C src/codex-safe-core fetch origin "$core"
          git -C src/codex-safe-core checkout "$core"
          node <<'NODE'
          const fs=require('fs');const pkg=require('./package.json');pkg.contributes.menus['scm/title']=[{command:'safeCodexChange.createOrUpdate',when:'scmProvider == git && isWorkspaceTrusted',group:'navigation@7'}];if(!pkg.scripts.ci.includes('verify-family-ui-contract.js'))pkg.scripts.ci=pkg.scripts.ci.replace('npm run verify:manifest','npm run verify:manifest && node src/codex-safe-core/scripts/verify-family-ui-contract.js .');fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');const c=require('./product-contract.json');c.productVersion='5.1.3';c.safeCoreVersion='4.10.2';c.safeCoreCommit='cd9788f1280a217fbe6d0beb59682a85a8b82c4d';fs.writeFileSync('product-contract.json',JSON.stringify(c,null,2)+'\n');for(const f of ['README.md','README.zh-CN.md','.codex-safe.example.json','MIGRATION.md'])if(fs.existsSync(f)){let t=fs.readFileSync(f,'utf8');t=t.replaceAll('76418b80533c644e3ab01045290cd3cdd355622c','cd9788f1280a217fbe6d0beb59682a85a8b82c4d').replaceAll('4.10.1','4.10.2');fs.writeFileSync(f,t);}let ch=fs.readFileSync('CHANGELOG.md','utf8');if(!ch.includes('## 5.1.3'))ch=ch.replace(/^# Changelog\s*/,'# Changelog\n\n## 5.1.3\n\n- Align the primary VS Code SCM toolbar with the Family UI Contract: Create / Update PR or MR is the single `navigation@7` Change action after Review and Commit.\n- Delivery Preflight remains available in the Change view and command surface, but no longer occupies the primary SCM toolbar.\n- Repin to immutable Safe Core 4.10.2; default model calls remain zero.\n\n');fs.writeFileSync('CHANGELOG.md',ch);
          NODE
          git add -u
          git add src/codex-safe-core
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(ui): make Change the final Family SCM action'
          git push origin HEAD:feat/family-scm-ui-contract
