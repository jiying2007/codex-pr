name: Bootstrap Change Safe 5.1
on:
  push:
    branches: [feat/change-safe-terminal-closure]
permissions:
  contents: write
jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Reconstruct verified product tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* | base64 -d > /tmp/change-safe.tar.gz
          echo '81b3ea6d470ec2c9d8d464d207366e9a01a49645239b8733592c2f55b30cb235  /tmp/change-safe.tar.gz' | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/change-safe.tar.gz -C .
          rm -rf src/codex-safe-core .bootstrap .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git update-index --add --cacheinfo 160000,43e818dc9ae91051f55374a9f9a47b9df6420cd6,src/codex-safe-core
          test "$(git ls-files -s src/codex-safe-core | awk '{print $1" "$2}')" = '160000 43e818dc9ae91051f55374a9f9a47b9df6420cd6'
          git commit -m 'feat: close Change Safe 5.1 delivery authorization [bootstrap-complete]'
          git push origin HEAD:feat/change-safe-terminal-closure
