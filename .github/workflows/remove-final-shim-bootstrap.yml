name: Remove Final Shim Bootstrap

on:
  push:
    branches: [cleanup/remove-final-shim]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: remove-final-shim-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name == 'push' || github.head_ref == 'cleanup/remove-final-shim'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cleanup/remove-final-shim
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/remove-final-shim.js
      - name: Ensure Linux Extension Host dependencies
        shell: bash
        run: |
          set -euo pipefail
          if command -v xvfb-run >/dev/null 2>&1 && ldconfig -p | grep -q 'libgtk-3.so' && ldconfig -p | grep -q 'libnss3.so'; then
            echo 'Extension Host dependencies already available.'
          else
            sudo apt-get update
            sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2
          fi
      - name: Verify terminal product
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/safe-contract.js
          node scripts/safe-core.js verify
          node scripts/safe-core.js upstream
          npm run check
          xvfb-run -a npm run test:integration
          npm run package
      - name: Remove non-workflow bootstrap files
        run: rm scripts/remove-final-shim.js .remove-final-shim-trigger
      - name: Commit validated product diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git commit -m 'chore: remove final Safe Core compatibility shim'
          git push origin HEAD:cleanup/remove-final-shim
