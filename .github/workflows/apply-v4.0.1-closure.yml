name: Apply v4.0.1 closure

on:
  push:
    branches: [v4.0.1-final-closure]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v4.0.1-final-closure
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Add PR provenance and prepare 4.0.1
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          let codex=fs.readFileSync('src/codex.js','utf8');
          const oldImport="const { isCliCompatibilityError } = require('./codex-safe-core/safe-contract');";
          const newImport="const { SAFE_CORE_VERSION, SAFE_CONTRACT_VERSION, PR_PROMPT_CONTRACT_VERSION, isCliCompatibilityError } = require('./codex-safe-core/safe-contract');\nconst { POLICY_SCHEMA_VERSION } = require('./codex-safe-core/policy');";
          if(!codex.includes(oldImport)) throw new Error('codex import anchor missing');
          codex=codex.replace(oldImport,newImport);
          const oldReturn="  return { result: validateStructuredResult(parsed), codexVersion: resolved.version };";
          const newReturn="  const result = validateStructuredResult(parsed);\n  const provenance = Object.freeze({\n    safeCoreVersion: SAFE_CORE_VERSION,\n    safeContractVersion: SAFE_CONTRACT_VERSION,\n    policySchemaVersion: POLICY_SCHEMA_VERSION,\n    promptContractVersion: PR_PROMPT_CONTRACT_VERSION,\n    codexVersion: resolved.version || 'unknown',\n    requestedModel: options.model || '',\n    resolvedModel: options.model || 'cli-default'\n  });\n  return { result, codexVersion: provenance.codexVersion, provenance };";
          if(!codex.includes(oldReturn)) throw new Error('codex return anchor missing');
          codex=codex.replace(oldReturn,newReturn);
          fs.writeFileSync('src/codex.js',codex);

          let ext=fs.readFileSync('extension.js','utf8');
          const sigOld='async function buildPreviewState(root, baseRef, context, structured, formatted, codexVersion, reviewEvidence, commitEvidence, options, token) {';
          const sigNew='async function buildPreviewState(root, baseRef, context, structured, formatted, codexVersion, provenance, reviewEvidence, commitEvidence, options, token) {';
          if(!ext.includes(sigOld)) throw new Error('preview signature anchor missing');
          ext=ext.replace(sigOld,sigNew);
          const stateOld='    codexVersion,\n    reviewEvidence,';
          const stateNew='    codexVersion,\n    provenance,\n    reviewEvidence,';
          if(!ext.includes(stateOld)) throw new Error('preview state anchor missing');
          ext=ext.replace(stateOld,stateNew);
          const callOld='const preview = await buildPreviewState(root, baseRef, context, codex.result, formatted, codex.codexVersion, reviewEvidence, commitEvidence, options, token);';
          const callNew='const preview = await buildPreviewState(root, baseRef, context, codex.result, formatted, codex.codexVersion, codex.provenance, reviewEvidence, commitEvidence, options, token);';
          if(!ext.includes(callOld)) throw new Error('preview call anchor missing');
          ext=ext.replace(callOld,callNew);
          ext=ext.replace('provenance=${stored.commitEvidence.status}`);','provenance=${stored.commitEvidence.status}, promptContract=${stored.provenance?.promptContractVersion || "unknown"}`);');
          fs.writeFileSync('extension.js',ext);

          for(const file of ['package.json','package-lock.json']){
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            data.version='4.0.1';
            if(file==='package-lock.json'&&data.packages?.['']) data.packages[''].version='4.0.1';
            fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');
          }
          let changelog=fs.readFileSync('CHANGELOG.md','utf8');
          if(!changelog.includes('## 4.0.1')) changelog=changelog.replace('## Unreleased\n','## Unreleased\n\n## 4.0.1\n\n### Changed\n\n- Persist PR generation provenance in preview state: Safe Core, Safe Contract, Policy Schema, Prompt Contract, Codex CLI and requested/resolved model identity.\n');
          fs.writeFileSync('CHANGELOG.md',changelog);
          NODE
          rm .github/workflows/apply-v4.0.1-closure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/codex.js extension.js package.json package-lock.json CHANGELOG.md .github/workflows/apply-v4.0.1-closure.yml
          git diff --cached --check
          git commit -m "fix: persist PR prompt and execution provenance"
          git push origin HEAD:v4.0.1-final-closure
