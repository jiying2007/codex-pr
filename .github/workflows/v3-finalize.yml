name: Family v3 PR finalizer

on:
  push:
    branches: [feat/family-v3-pr]
    paths: [.github/workflows/v3-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Finalize Family v3 metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const version='3.0.0';
          let test=fs.readFileSync('test.js','utf8');
          test=test.replace('  POLICY_SCHEMA_VERSION,\n','');
          test=test.replace("const { validatePolicySection } = require('./src/codex-safe-core/policy');", "const { POLICY_SCHEMA_VERSION, validatePolicySection } = require('./src/codex-safe-core/policy');");
          fs.writeFileSync('test.js',test);
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          pkg.version=version; lock.version=version; lock.packages[''].version=version;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          if(fs.existsSync('.codex-safe.example.json')){
            const p=JSON.parse(fs.readFileSync('.codex-safe.example.json','utf8'));
            p.$schema='https://raw.githubusercontent.com/jiying2007/codex-safe-core/e6e25b502aa35a079f660346785cf283fe293b6d/codex-safe.schema.json';
            p.schemaVersion=3;
            fs.writeFileSync('.codex-safe.example.json',JSON.stringify(p,null,2)+'\n');
          }
          let c=fs.readFileSync('CHANGELOG.md','utf8');
          if(!c.includes('\n## 3.0.0\n')){
            const notes='\n## 3.0.0\n\n### Changed\n\n- Hard-switched to Codex Safe Core 3.0.1 and Policy Schema v3.\n- Consume Review Receipt v3 and Commit Receipt v3 range provenance with no v2 fallback.\n- Preserve PR generation as a local narrative/provenance product boundary.\n';
            c=c.replace('## Unreleased\n','## Unreleased\n'+notes);
            fs.writeFileSync('CHANGELOG.md',c);
          }
          NODE
          npm run verify:lock
          git rm .github/workflows/v3-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test.js package.json package-lock.json CHANGELOG.md .codex-safe.example.json
          git diff --cached --check
          git commit -m 'chore(release): finalize PR Safe v3.0.0 metadata'
          git push origin HEAD:feat/family-v3-pr
