name: GitLab Provider Matrix
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gitlab-provider-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provider-e2e:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        gitlab: ['14.6.1-ce.0','17.11.7-ce.0','19.3.0-ce.0']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '24.19.0', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start GitLab CE
        run: |
          docker run -d --name gitlab --shm-size=256m -p 127.0.0.1:8080:80 \
            -e GITLAB_OMNIBUS_CONFIG="external_url 'http://localhost'; gitlab_rails['initial_root_password']='g4TQ9zV2mL7xK5pR8wN3cY6fH4sJ9'" \
            "gitlab/gitlab-ce:${{ matrix.gitlab }}"
      - name: Wait for GitLab
        run: |
          set -euo pipefail
          for i in $(seq 1 210); do
            if curl -fsS http://127.0.0.1:8080/users/sign_in >/dev/null 2>&1 && docker exec gitlab gitlab-rails runner "raise unless User.find_by_username('root')" >/dev/null 2>&1; then break; fi
            if [ "$i" = 210 ]; then docker logs gitlab; exit 1; fi
            sleep 5
          done
      - name: Create deterministic API token
        run: |
          docker exec gitlab gitlab-rails runner "u=User.find_by_username('root'); u.personal_access_tokens.where(name:'change-safe-ci').delete_all; t=u.personal_access_tokens.create(scopes:['api'],name:'change-safe-ci',expires_at:1.day.from_now); t.set_token('token-string-here123'); t.save!"
      - name: Run provider contract
        env:
          GITLAB_BASE_URL: http://127.0.0.1:8080
          GITLAB_API_TOKEN: token-string-here123
        run: node scripts/gitlab-system-smoke.js
      - if: failure()
        run: docker logs --tail 500 gitlab
