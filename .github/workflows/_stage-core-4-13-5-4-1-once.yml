name: Stage Change Safe Core 4.13.0 Repin Once
on:
  push:
    branches: [chore/core-4.13.0-5.4.1]
permissions:
  contents: write
jobs:
  repin-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '24.19.0' }
      - name: Repin Change Safe to Core 4.13.0
        shell: bash
        run: |
          set -euo pipefail
          CORE=d95f67cc61ce66c16e2aa440829655919e906a75
          git -C src/codex-safe-core fetch origin "$CORE"
          git -C src/codex-safe-core checkout --detach "$CORE"
          node src/codex-safe-core/scripts/repin-consumer.js . "$CORE"
          npm version 5.4.1 --no-git-tag-version
          node <<'NODE'
          const fs=require('fs');
          const p='product-contract.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));
          c.productVersion='5.4.1';
          c.codexRuntimeVersionConsumed=3;
          c.providerContractVersionConsumed=3;
          fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          const ch='CHANGELOG.md';let s=fs.readFileSync(ch,'utf8');
          if(!s.includes('## 5.4.1 - 2026-09-03')) s=`## 5.4.1 - 2026-09-03\n\n- Repin Codex Change Safe to immutable Codex Safe Core 4.13.0 and consume Runtime/Provider Contract v3 provenance without changing SCM delivery behavior.\n- Preserve GitHub/GitLab provider discovery, GitLab 14.6.1+ compatibility, private-LAN HTTP trust rules, zero default model calls, Review Receipt v5 and Commit Receipt v4 consumption unchanged.\n\n${s}`;
          fs.writeFileSync(ch,s);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(core): repin Change Safe 5.4.1 to Core 4.13.0'
          git push origin HEAD:chore/core-4.13.0-5.4.1
          npm ci --ignore-scripts --no-audit --no-fund
          npm run ci
          npm run build
          npm run package
